<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<title>AI Scheduler Enterprise</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBHZU6dHcyLl1MJW2NzEZx4zwpV_spv9Os",
  authDomain: "limpieza-peron.firebaseapp.com",
  projectId: "limpieza-peron",
  storageBucket: "limpieza-peron.firebasestorage.app",
  messagingSenderId: "542479002690",
  appId: "1:542479002690:web:33a321a6fa818674f891db"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ===== 人员数据（可编辑）=====
let staffData = {
men:["NEHEMIAS","FRANCO","CAMILO","CHANGO","BRAYAN","NICOLAS"],
women:["GISEL","DAMARIS","PRISCILA","ABRIL","TANIA","MILAGROS","VALENTINA","JACQUELINE"]
};

window.addStaff=function(){
let name=prompt("输入新员工名字").toUpperCase();
let group=prompt("输入组：men 或 women");
if(group==="men") staffData.men.push(name);
if(group==="women") staffData.women.push(name);
alert("已添加："+name);
}

window.removeStaff=function(){
let name=prompt("输入离职员工名字").toUpperCase();
staffData.men=staffData.men.filter(x=>x!==name);
staffData.women=staffData.women.filter(x=>x!==name);
alert("已删除："+name);
}

// ===== 统计 =====
let stats={};

function initStats(){
[...staffData.men,...staffData.women].forEach(n=>{
if(!stats[n]) stats[n]={cocina:0,salon:0,h:0,m:0,total:0};
});
}

window.auto=function(){
initStats();
let men=staffData.men;
let women=staffData.women;
let all=[...men,...women];

let table=document.getElementById("tabla");

for(let d=1;d<=24;d++){

let h=men.sort((a,b)=>stats[a].h-stats[b].h)[0];
let m=women.sort((a,b)=>stats[a].m-stats[b].m)[0];

stats[h].h++; stats[h].total++;
stats[m].m++; stats[m].total++;

let avail=all.filter(x=>x!==h&&x!==m)
.sort((a,b)=>stats[a].total-stats[b].total);

let c1=avail[0],c2=avail[1],s1=avail[2],s2=avail[3];

stats[c1].cocina++; stats[c1].total++;
stats[c2].cocina++; stats[c2].total++;
stats[s1].salon++; stats[s1].total++;
stats[s2].salon++; stats[s2].total++;

let r=table.rows[d];
r.cells[1].innerText=c1;
r.cells[2].innerText=c2;
r.cells[3].innerText=s1;
r.cells[4].innerText=s2;
r.cells[5].innerText=h;
r.cells[6].innerText=m;
}

renderStats();
}

function renderStats(){
let div=document.getElementById("stats");
div.innerHTML="<h3>员工累计统计</h3>";
for(let k in stats){
let s=stats[k];
div.innerHTML+=`${k} → Cocina:${s.cocina} | Salon:${s.salon} | H:${s.h} | M:${s.m} | 总:${s.total}<br>`;
}
}
</script>

<style>
body{font-family:Arial;background:#f4f6f8;padding:20px}
table{border-collapse:collapse;background:white}
td,th{border:1px solid #ccc;padding:6px;text-align:center}
button{margin:5px;padding:6px 12px}
</style>

</head>

<body>

<h2>月度AI自平衡排班（24天）</h2>

<button onclick="addStaff()">➕ 添加员工</button> <button onclick="removeStaff()">❌ 删除员工</button> <button onclick="auto()">生成公平排班</button>

<h3>排班表</h3>
<table id="tabla">
<tr><th>Dia</th><th>Cocina1</th><th>Cocina2</th><th>Salon1</th><th>Salon2</th><th>Baño Hombre</th><th>Baño Mujer</th></tr>
<script>
for(let i=1;i<=24;i++){
document.write(`<tr><td>${i}</td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`);
}
</script>
</table>

<div id="stats"></div>

</body>
</html>
