<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Scheduler Business FULL</title>

<style>
body{font-family:Arial;background:#f4f6f8;padding:20px}
table{border-collapse:collapse;background:white}
td,th{border:1px solid #ccc;padding:6px;text-align:center}
.flex{display:flex;gap:30px}
button{margin:6px;padding:6px 14px}
</style>

<script>

let men=["NEHEMIAS","FRANCO","CAMILO","CHANGO","BRAYAN","NICOLAS"];
let women=["GISEL","DAMARIS","PRISCILA","ABRIL","TANIA","MILAGROS","VALENTINA","JACQUELINE"];

let stats,lastH,lastM;

function resetStats(){
stats={}; lastH=null; lastM=null;
[...men,...women].forEach(n=>{
stats[n]={cocina:0,salon:0,h:0,m:0,total:0};
});
}

// ===== 添加员工 =====
function addStaff(){
let name=prompt("输入名字").toUpperCase();
let group=prompt("输入分组：men 或 women");

if(group==="men") men.push(name);
else women.push(name);

alert("已添加："+name+"（点击生成重新平衡）");
}

// ===== 删除员工 =====
function removeStaff(){
let name=prompt("输入离职员工名字").toUpperCase();
men=men.filter(x=>x!==name);
women=women.filter(x=>x!==name);
alert("已删除："+name+"（点击生成重新平衡）");
}

function auto(){

resetStats();
let table=document.getElementById("tabla");

for(let d=1; d<=24; d++){

let r=table.rows[d];
let absent=document.getElementById("abs"+d).value.toUpperCase().split(",").map(x=>x.trim()).filter(x=>x!="");

// ===== 厕所轮换 =====
let h=men.filter(x=>x!==lastH && !absent.includes(x))
.sort((a,b)=>stats[a].h-stats[b].h)[0];

let m=women.filter(x=>x!==lastM && !absent.includes(x))
.sort((a,b)=>stats[a].m-stats[b].m)[0];

stats[h].h++; stats[h].total++;
stats[m].m++; stats[m].total++;
lastH=h; lastM=m;

// ===== 其他岗位 =====
let used=[h,m];
let all=[...men,...women].filter(x=>!absent.includes(x));

function score(p,role){
let s=stats[p].total*3;
if(role==="cocina") s+=stats[p].cocina*2;
if(role==="salon") s+=stats[p].salon*2;
return s;
}

let avail=all.filter(x=>!used.includes(x));

let c1=avail.sort((a,b)=>score(a,"cocina")-score(b,"cocina"))[0];
used.push(c1);

let c2=avail.filter(x=>x!==c1).sort((a,b)=>score(a,"cocina")-score(b,"cocina"))[0];

let remain=all.filter(x=>!used.includes(x)&&x!==c2);

let s1=remain.sort((a,b)=>score(a,"salon")-score(b,"salon"))[0];
used.push(s1);

let s2=remain.filter(x=>x!==s1).sort((a,b)=>score(a,"salon")-score(b,"salon"))[0];

[c1,c2].forEach(p=>{stats[p].cocina++;stats[p].total++;});
[s1,s2].forEach(p=>{stats[p].salon++;stats[p].total++;});

// ===== 写入表 =====
r.cells[1].innerText=c1;
r.cells[2].innerText=c2;
r.cells[3].innerText=s1;
r.cells[4].innerText=s2;
r.cells[5].innerText=h;
r.cells[6].innerText=m;
}

renderStats();
}

function renderStats(){
let html=`<h3>员工统计</h3>
<table>
<tr><th>姓名</th><th>Cocina</th><th>Salon</th><th>H</th><th>M</th><th>总</th></tr>`;
for(let n in stats){
let s=stats[n];
html+=`<tr>
<td>${n}</td>
<td>${s.cocina}</td>
<td>${s.salon}</td>
<td>${s.h}</td>
<td>${s.m}</td>
<td>${s.total}</td>
</tr>`;
}
html+="</table>";
document.getElementById("stats").innerHTML=html;
}

</script>

</head>

<body>

<h2>商业稳定版排班系统</h2>

<button onclick="addStaff()">添加员工</button> <button onclick="removeStaff()">删除员工</button> <button onclick="auto()">生成 / 重新计算公平排班</button>

<div class="flex">

<table id="tabla">
<tr>
<th>Dia</th><th>Cocina1</th><th>Cocina2</th>
<th>Salon1</th><th>Salon2</th>
<th>Baño H</th><th>Baño M</th><th>缺勤</th>
</tr>

<script>
for(let i=1;i<=24;i++){
document.write(`<tr>
<td>${i}</td>
<td></td><td></td><td></td><td></td><td></td><td></td>
<td><input id="abs${i}" placeholder="FRANCO,CAMILO"></td>
</tr>`);
}
</script>

</table>

<div id="stats"></div>

</div>

</body>
</html>
