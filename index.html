<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>AI公平排班系统 · FINAL</title>

<style>
body{font-family:Arial;background:#f5f5f5;padding:20px}
table{border-collapse:collapse;background:white}
td,th{border:1px solid #ccc;padding:6px;text-align:center}
input{width:120px}
button{margin:4px;padding:6px 10px}
.box{display:flex;gap:30px;align-items:flex-start}
h2{margin:6px 0}
.small{font-size:12px;color:#666}
</style>
</head>

<body>

<h2>AI智能排班系统 · 终极收官版</h2>

<button onclick="addEmployee()">添加员工</button>
<button onclick="removeEmployee()">删除员工</button>
<button onclick="generate()">生成排班 / 自动恢复公平</button>
<button onclick="resetAbsent()">清空缺勤</button>

<div class="box">

<!-- 排班表 -->
<div>
<h3>排班表（长期公平）</h3>
<table id="schedule"></table>
</div>

<!-- 统计 -->
<div>
<h3>员工统计（自动公平监控）</h3>
<table id="stats"></table>

<h3>缺勤历史</h3>
<table id="history"></table>
</div>

</div>

<script>
/* ========= 基础数据 ========= */

let employees = JSON.parse(localStorage.getItem("emp")||`[
"NEHEMIAS","FRANCO","CAMILO","CHANGO","BRAYAN","NICOLAS",
"GISEL","DAMARIS","PRISCILA","ABRIL","TANIA","MILAGROS","VALENTINA","JACQUELINE"
]`);

let absent = JSON.parse(localStorage.getItem("absent")||"{}");
let history = JSON.parse(localStorage.getItem("history")||"[]");

const days = 30;

/* ========= 工具 ========= */

function save(){
localStorage.setItem("emp",JSON.stringify(employees));
localStorage.setItem("absent",JSON.stringify(absent));
localStorage.setItem("history",JSON.stringify(history));
}

function shuffle(a){
return a.sort(()=>Math.random()-0.5);
}

/* ========= 排班核心（真正公平） ========= */

function generate(){

let stats={};
employees.forEach(e=>stats[e]={c:0,s:0,h:0,m:0,total:0});

let table=`<tr>
<th>Dia</th>
<th>Cocina1</th><th>Cocina2</th>
<th>Salon1</th><th>Salon2</th>
<th>Baño H</th><th>Baño M</th>
<th>缺勤</th>
</tr>`;

for(let d=1;d<=days;d++){

let pool=[...employees];
let a=(absent[d]||"").split(",").map(x=>x.trim()).filter(x=>x);
pool=pool.filter(x=>!a.includes(x));

shuffle(pool);

function pick(type){
pool.sort((x,y)=>stats[x][type]-stats[y][type]);
let p=pool.shift();
stats[p][type]++;
stats[p].total++;
return p;
}

let c1=pick("c");
let c2=pick("c");
let s1=pick("s");
let s2=pick("s");
let h=pick("h");
let m=pick("m");

table+=`<tr>
<td>${d}</td>
<td>${c1}</td><td>${c2}</td>
<td>${s1}</td><td>${s2}</td>
<td>${h}</td><td>${m}</td>
<td><input value="${absent[d]||""}" onchange="setAbsent(${d},this.value)"></td>
</tr>`;
}

document.getElementById("schedule").innerHTML=table;

/* ===== 统计表 ===== */

let st=`<tr><th>姓名</th><th>Cocina</th><th>Salon</th><th>H</th><th>M</th><th>总</th><th>公平</th></tr>`;
for(let e of employees){
let s=stats[e];
let fairness=Math.round(100-Math.abs(s.c-s.s)*5-Math.abs(s.h-s.m)*5);
st+=`<tr>
<td>${e}</td><td>${s.c}</td><td>${s.s}</td>
<td>${s.h}</td><td>${s.m}</td>
<td>${s.total}</td><td>${fairness}%</td>
</tr>`;
}
document.getElementById("stats").innerHTML=st;

/* ===== 历史 ===== */

let hhtml=`<tr><th>Dia</th><th>缺勤</th></tr>`;
history.slice(-20).reverse().forEach(r=>{
hhtml+=`<tr><td>${r.d}</td><td>${r.a}</td></tr>`;
});
document.getElementById("history").innerHTML=hhtml;

save();
}

/* ========= 缺勤 ========= */

function setAbsent(d,val){
absent[d]=val;
history.push({d:d,a:val});
save();
generate();
}

function resetAbsent(){
if(confirm("清空所有缺勤？")){
absent={};
history=[];
save();
generate();
}
}

/* ========= 员工管理 ========= */

function addEmployee(){
let n=prompt("输入新员工名字");
if(!n)return;
n=n.toUpperCase();
if(!employees.includes(n)) employees.push(n);
save();
generate();
}

function removeEmployee(){
let n=prompt("输入离职员工名字");
if(!n)return;
n=n.toUpperCase();
employees=employees.filter(x=>x!==n);
save();
generate();
}

/* ========= 启动 ========= */

generate();
</script>

</body>
</html>
