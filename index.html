<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI企业排班系统</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<style>
body{font-family:Arial;background:#f5f5f5;padding:20px}
table{border-collapse:collapse;background:#fff}
td,th{border:1px solid #ccc;padding:6px 10px;text-align:center}
button{padding:6px 12px;margin:4px}
.container{display:flex;gap:30px}
</style>
</head>

<body>

<h2>👑 AI企业排班系统</h2>

<div id="login">
邮箱 <input id="email"><br>
密码 <input id="pass" type="password"><br>
<button onclick="login()">登录</button>
</div>

<div id="app" style="display:none">
<button onclick="generate()">重新公平排班</button>
<table id="schedule"></table>
<table id="stats"></table>
</div>

<script>
const firebaseConfig={
apiKey:"AIzaSyBHZU6dHcyLl1MJW2NzEZx4zwpV_spv9Os",
authDomain:"limpieza-peron.firebaseapp.com",
projectId:"limpieza-peron"
};
firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.firestore();

auth.onAuthStateChanged(u=>{
if(u){login.style.display="none";app.style.display="block";generate();}
});

function login(){
auth.signInWithEmailAndPassword(email.value,pass.value)
.catch(e=>alert(e.message));
}

async function generate(){

let staffDoc=await db.collection("staff").doc("list").get();
let staff=staffDoc.data().names;

let stats={};
staff.forEach(s=>stats[s]={c:0,s:0,h:0,m:0,t:0});

let table=document.getElementById("schedule");
table.innerHTML="<tr><th>Dia</th><th>C1</th><th>C2</th><th>S1</th><th>S2</th><th>H</th><th>M</th></tr>";

for(let d=1;d<=30;d++){

staff.sort((a,b)=>stats[a].t-stats[b].t);

let c1=staff[0],c2=staff[1],s1=staff[2],s2=staff[3],h=staff[4],m=staff[5];

stats[c1].c++;stats[c1].t++;
stats[c2].c++;stats[c2].t++;
stats[s1].s++;stats[s1].t++;
stats[s2].s++;stats[s2].t++;
stats[h].h++;stats[h].t++;
stats[m].m++;stats[m].t++;

table.innerHTML+=`
<tr><td>${d}</td><td>${c1}</td><td>${c2}</td><td>${s1}</td><td>${s2}</td><td>${h}</td><td>${m}</td></tr>`;
}

renderStats(stats);
}

function renderStats(stats){
let t=document.getElementById("stats");
t.innerHTML="<tr><th>姓名</th><th>C</th><th>S</th><th>H</th><th>M</th><th>总</th></tr>";
for(let k in stats){
t.innerHTML+=`<tr><td>${k}</td><td>${stats[k].c}</td><td>${stats[k].s}</td><td>${stats[k].h}</td><td>${stats[k].m}</td><td>${stats[k].t}</td></tr>`;
}
}
</script>
</body>
</html>
