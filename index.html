<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>店长控制排班系统 · 旗舰稳定版</title>

<style>
body{font-family:Arial;background:#f5f5f5;margin:20px}
table{border-collapse:collapse;background:#fff}
td,th{border:1px solid #ccc;padding:6px 10px;text-align:center}
button{margin:5px;padding:6px 12px}
input{width:120px}
.container{display:flex;gap:30px}
.title{font-size:22px;font-weight:bold;margin-bottom:10px}
.admin{color:red;font-weight:bold}
</style>
</head>

<body>

<div class="title">👑 店长控制排班系统 · 旗舰稳定版</div>

<div class="admin">管理员模式（员工只读）</div>

<button onclick="addStaff()">添加员工</button>
<button onclick="removeStaff()">删除员工</button>
<button onclick="generateSchedule()">生成排班 / 慢恢复公平</button>
<button onclick="clearAbsence()">清空缺勤</button>

<br><br>

<div class="container">

<!-- 排班表 -->
<div>
<table id="schedule">
<tr>
<th>Dia</th>
<th>Cocina1</th>
<th>Cocina2</th>
<th>Salon1</th>
<th>Salon2</th>
<th>Baño H</th>
<th>Baño M</th>
<th>缺勤</th>
</tr>
</table>
</div>

<!-- 统计 -->
<div>
<table id="stats">
<tr>
<th>姓名</th>
<th>Cocina</th>
<th>Salon</th>
<th>H</th>
<th>M</th>
<th>总</th>
</tr>
</table>
</div>

</div>

<script>

// ===== 员工名单 =====
let staffList = JSON.parse(localStorage.getItem("staffList")) || [
"NEHEMIAS","FRANCO","CAMILO","BRAYAN","CHANGO","NICOLAS",
"GISSEL","DAMARIS","PRISCILA","ABRIL","TANIA","MILAGROS","VALENTINA","JACQUELINE"
];

// ===== 初始化表格 =====
function buildTable(){
  const table = document.getElementById("schedule");
  table.innerHTML = `
<tr>
<th>Dia</th>
<th>Cocina1</th>
<th>Cocina2</th>
<th>Salon1</th>
<th>Salon2</th>
<th>Baño H</th>
<th>Baño M</th>
<th>缺勤</th>
</tr>`;

  for(let d=1; d<=30; d++){
    let row = `<tr>
<td>${d}</td>
<td id="Cocina1-${d}"></td>
<td id="Cocina2-${d}"></td>
<td id="Salon1-${d}"></td>
<td id="Salon2-${d}"></td>
<td id="H-${d}"></td>
<td id="M-${d}"></td>
<td><input id="abs-${d}" onchange="saveAbs()"></td>
</tr>`;
    table.innerHTML += row;
  }
}

// ===== 生成排班（旗舰稳定算法）=====
function generateSchedule(){

  const days = 30;
  let history = JSON.parse(localStorage.getItem("historyStats")||"{}");

  staffList.forEach(p=>{
    if(!history[p]) history[p]={Cocina:0,Salon:0,H:0,M:0};
  });

  let rotation = [...staffList];

  for(let d=1; d<=days; d++){

    let absInput = document.getElementById(`abs-${d}`).value.toUpperCase();
    let abs = absInput ? absInput.split(",").map(x=>x.trim()) : [];

    let today = rotation.filter(p=>!abs.includes(p));

    while(today.length<6){
      today.push(rotation[Math.floor(Math.random()*rotation.length)]);
    }

    today.sort((a,b)=>{
      const ta = history[a].Cocina+history[a].Salon+history[a].H+history[a].M;
      const tb = history[b].Cocina+history[b].Salon+history[b].H+history[b].M;
      return ta-tb;
    });

    const a=today.slice(0,6);

    setCell(d,"Cocina1",a[0]);
    setCell(d,"Cocina2",a[1]);
    setCell(d,"Salon1",a[2]);
    setCell(d,"Salon2",a[3]);
    setCell(d,"H",a[4]);
    setCell(d,"M",a[5]);

    history[a[0]].Cocina++;
    history[a[1]].Cocina++;
    history[a[2]].Salon++;
    history[a[3]].Salon++;
    history[a[4]].H++;
    history[a[5]].M++;

    rotation.push(rotation.shift());
  }

  localStorage.setItem("historyStats",JSON.stringify(history));
  renderStats();
}

// ===== 填单元格 =====
function setCell(day,role,name){
  document.getElementById(`${role}-${day}`).innerText=name;
}

// ===== 统计 =====
function renderStats(){
  const stats=document.getElementById("stats");
  stats.innerHTML=`<tr><th>姓名</th><th>Cocina</th><th>Salon</th><th>H</th><th>M</th><th>总</th></tr>`;

  let history=JSON.parse(localStorage.getItem("historyStats")||"{}");

  staffList.forEach(p=>{
    let s=history[p]||{Cocina:0,Salon:0,H:0,M:0};
    let total=s.Cocina+s.Salon+s.H+s.M;
    stats.innerHTML+=`<tr>
<td>${p}</td>
<td>${s.Cocina}</td>
<td>${s.Salon}</td>
<td>${s.H}</td>
<td>${s.M}</td>
<td>${total}</td>
</tr>`;
  });
}

// ===== 添加员工 =====
function addStaff(){
  let name=prompt("输入新员工名字").toUpperCase();
  if(!name) return;
  if(staffList.includes(name)) return alert("已存在");
  staffList.push(name);
  localStorage.setItem("staffList",JSON.stringify(staffList));
  alert("已添加");
}

// ===== 删除员工 =====
function removeStaff(){
  let name=prompt("输入要删除的员工").toUpperCase();
  staffList=staffList.filter(p=>p!==name);
  localStorage.setItem("staffList",JSON.stringify(staffList));
  alert("已删除");
}

// ===== 保存缺勤 =====
function saveAbs(){
  let abs={};
  for(let d=1; d<=30; d++){
    abs[d]=document.getElementById(`abs-${d}`).value;
  }
  localStorage.setItem("absence",JSON.stringify(abs));
}

// ===== 读取缺勤 =====
function loadAbs(){
  let abs=JSON.parse(localStorage.getItem("absence")||"{}");
  for(let d=1; d<=30; d++){
    if(abs[d]) document.getElementById(`abs-${d}`).value=abs[d];
  }
}

// ===== 清空缺勤 =====
function clearAbsence(){
  localStorage.removeItem("absence");
  location.reload();
}

// ===== 初始化 =====
buildTable();
loadAbs();
renderStats();

</script>

</body>
</html>
