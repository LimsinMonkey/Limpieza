<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<title>AI Scheduler ULTRA FAIR</title>

<style>
body{font-family:Arial;background:#f4f6f8;padding:20px}
table{border-collapse:collapse;background:white}
td,th{border:1px solid #ccc;padding:6px;text-align:center}
td{min-width:90px}
button{margin:6px;padding:6px 14px}
.flex{display:flex;gap:30px;align-items:flex-start}
</style>

<script>

let men=["NEHEMIAS","FRANCO","CAMILO","CHANGO","BRAYAN","NICOLAS"];
let women=["GISEL","DAMARIS","PRISCILA","ABRIL","TANIA","MILAGROS","VALENTINA","JACQUELINE"];

let stats={};
let lastH=null,lastM=null;

function initStats(){
[...men,...women].forEach(n=>{
if(!stats[n]) stats[n]={cocina:0,salon:0,h:0,m:0,total:0};
});
}

function addStaff(){
let n=prompt("名字").toUpperCase();
let g=prompt("men 或 women");
if(g==="men") men.push(n);
else women.push(n);
}

function removeStaff(){
let n=prompt("删除谁").toUpperCase();
men=men.filter(x=>x!==n);
women=women.filter(x=>x!==n);
delete stats[n];
}

function auto(){

initStats();
let table=document.getElementById("tabla");

// 读取已手动填写（锁定）
for(let d=1;d<=24;d++){
let r=table.rows[d];
if(r.cells[1].innerText!==""){
let c1=r.cells[1].innerText,c2=r.cells[2].innerText;
let s1=r.cells[3].innerText,s2=r.cells[4].innerText;
let h=r.cells[5].innerText,m=r.cells[6].innerText;

[c1,c2].forEach(p=>{if(stats[p]){stats[p].cocina++;stats[p].total++;}});
[s1,s2].forEach(p=>{if(stats[p]){stats[p].salon++;stats[p].total++;}});
if(stats[h]){stats[h].h++;stats[h].total++;lastH=h;}
if(stats[m]){stats[m].m++;stats[m].total++;lastM=m;}
}
}

// 自动排剩余
for(let d=1;d<=24;d++){

let r=table.rows[d];
if(r.cells[1].innerText!=="") continue;

// ===== 厕所轮换 =====
let h=men.filter(x=>x!==lastH).sort((a,b)=>stats[a].h-stats[b].h)[0];
let m=women.filter(x=>x!==lastM).sort((a,b)=>stats[a].m-stats[b].m)[0];

stats[h].h++; stats[h].total++;
stats[m].m++; stats[m].total++;
lastH=h; lastM=m;

let used=[h,m];
let all=[...men,...women];

function score(p,role){
let s=stats[p].total*3;
if(role==="cocina") s+=stats[p].cocina*2;
if(role==="salon") s+=stats[p].salon*2;

// 男女混排惩罚
let maleCount=used.filter(x=>men.includes(x)).length;
let femaleCount=used.filter(x=>women.includes(x)).length;
if(men.includes(p)&&maleCount>femaleCount) s+=1;
if(women.includes(p)&&femaleCount>maleCount) s+=1;

return s;
}

let avail=all.filter(x=>!used.includes(x));

// Cocina
let c1=avail.sort((a,b)=>score(a,"cocina")-score(b,"cocina"))[0];
used.push(c1);
let c2=avail.filter(x=>x!==c1).sort((a,b)=>score(a,"cocina")-score(b,"cocina"))[0];

// Salon
let remain=all.filter(x=>!used.includes(x)&&x!==c2);
let s1=remain.sort((a,b)=>score(a,"salon")-score(b,"salon"))[0];
used.push(s1);
let s2=remain.filter(x=>x!==s1).sort((a,b)=>score(a,"salon")-score(b,"salon"))[0];

[c1,c2].forEach(p=>{stats[p].cocina++;stats[p].total++;});
[s1,s2].forEach(p=>{stats[p].salon++;stats[p].total++;});

r.cells[1].innerText=c1;
r.cells[2].innerText=c2;
r.cells[3].innerText=s1;
r.cells[4].innerText=s2;
r.cells[5].innerText=h;
r.cells[6].innerText=m;
}

renderStats();
}

function renderStats(){

let html=`<h3>员工累计统计</h3>
<table>
<tr><th>姓名</th><th>Cocina</th><th>Salon</th><th>男厕</th><th>女厕</th><th>总</th></tr>`;

for(let n in stats){
let s=stats[n];
html+=`<tr>
<td>${n}</td>
<td>${s.cocina}</td>
<td>${s.salon}</td>
<td>${s.h}</td>
<td>${s.m}</td>
<td>${s.total}</td>
</tr>`;
}

html+="</table>";
document.getElementById("stats").innerHTML=html;
}

</script>

</head>

<body>

<h2>AI长期公平排班（24天）</h2>

<button onclick="addStaff()">添加员工</button> <button onclick="removeStaff()">删除员工</button> <button onclick="auto()">生成/恢复公平排班</button>

<div class="flex">

<table id="tabla">
<tr>
<th>Dia</th>
<th>Cocina1</th>
<th>Cocina2</th>
<th>Salon1</th>
<th>Salon2</th>
<th>Baño Hombre</th>
<th>Baño Mujer</th>
</tr>

<script>
for(let i=1;i<=24;i++){
document.write(`<tr>
<td>${i}</td>
<td contenteditable></td>
<td contenteditable></td>
<td contenteditable></td>
<td contenteditable></td>
<td contenteditable></td>
<td contenteditable></td>
</tr>`);
}
</script>

</table>

<div id="stats"></div>

</div>

</body>
</html>
