<!DOCTYPE html>

<html lang="zh">
<head>
<meta charset="UTF-8">
<title>👑 店长控制系统 · 旗舰稳定版</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* Firebase 配置 */
const firebaseConfig = {
  apiKey: "AIzaSyBHZU6dHcyLl1MJW2NzEZx4zwpV_spv9Os",
  authDomain: "limpieza-peron.firebaseapp.com",
  projectId: "limpieza-peron",
  storageBucket: "limpieza-peron.firebasestorage.app",
  messagingSenderId: "542479002690",
  appId: "1:542479002690:web:33a321a6fa818674f891db"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ======================
   店长控制系统核心
====================== */

let staff = [];
let schedule = [];
let stats = {};
let absHistory = [];

const DAYS = 30;
const POSTS = ["C1","C2","S1","S2","H","M"];

async function loadStaff(){
  const snap = await getDoc(doc(db,"staff","list"));
  staff = snap.exists() ? snap.data().names : [];
}

function initStats(){
  stats = {};
  staff.forEach(n=>{
    stats[n]={C:0,S:0,H:0,M:0,total:0};
  });
}

function pickFair(post){
  let best=null,score=9999;
  staff.forEach(n=>{
    let s=stats[n];
    let val = post=="C1"||post=="C2"?s.C:
              post=="S1"||post=="S2"?s.S:
              post=="H"?s.H:s.M;
    if(val<score){score=val;best=n;}
  });
  return best;
}

function generate(){
  schedule=[];
  initStats();

  for(let d=1;d<=DAYS;d++){
    let day={};
    POSTS.forEach(p=>{
      let name=pickFair(p);
      day[p]=name;
      stats[name].total++;
      if(p.startsWith("C"))stats[name].C++;
      if(p.startsWith("S"))stats[name].S++;
      if(p=="H")stats[name].H++;
      if(p=="M")stats[name].M++;
    });
    schedule.push(day);
  }
  render();
}

function render(){
  let html="<table border=1><tr><th>Day</th><th>C1</th><th>C2</th><th>S1</th><th>S2</th><th>H</th><th>M</th></tr>";
  schedule.forEach((d,i)=>{
    html+=`<tr><td>${i+1}</td><td>${d.C1}</td><td>${d.C2}</td><td>${d.S1}</td><td>${d.S2}</td><td>${d.H}</td><td>${d.M}</td></tr>`;
  });
  html+="</table>";
  document.getElementById("table").innerHTML=html;

  let statHtml="<table border=1><tr><th>Name</th><th>C</th><th>S</th><th>H</th><th>M</th><th>Total</th></tr>";
  for(let n in stats){
    let s=stats[n];
    statHtml+=`<tr><td>${n}</td><td>${s.C}</td><td>${s.S}</td><td>${s.H}</td><td>${s.M}</td><td>${s.total}</td></tr>`;
  }
  statHtml+="</table>";
  document.getElementById("stats").innerHTML=statHtml;
}

async function save(){
  await setDoc(doc(db,"scheduler","month"),{
    schedule,
    stats,
    absHistory,
    time:Date.now()
  });
  alert("已保存到云端");
}

async function load(){
  const snap=await getDoc(doc(db,"scheduler","month"));
  if(!snap.exists()) return;
  const data=snap.data();
  schedule=data.schedule||[];
  stats=data.stats||{};
  absHistory=data.absHistory||[];
  render();
}

window.generate=generate;
window.save=save;
window.load=load;

await loadStaff();
await load();
</script>

<style>
body{font-family:Arial;background:#f4f4f4;padding:20px}
button{margin:5px;padding:8px 16px}
table{border-collapse:collapse;background:white}
td,th{padding:6px 10px;text-align:center}
</style>

</head>

<body>

<h2>👑 店长控制系统 · 旗舰稳定版</h2>

<button onclick="generate()">生成30天公平排班</button> <button onclick="save()">保存云端</button> <button onclick="load()">读取云端</button>

<h3>排班表</h3>
<div id="table"></div>

<h3>员工统计（自动公平）</h3>
<div id="stats"></div>

</body>
</html>
