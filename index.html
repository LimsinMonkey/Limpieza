<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>AI排班系统 · 企业终极稳定版</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
body{font-family:Arial;margin:20px;background:#f5f5f5}
table{border-collapse:collapse;background:white}
td,th{border:1px solid #ccc;padding:6px 10px;text-align:center}
button{margin:5px;padding:6px 12px}
input{width:120px}
.locked{background:#eee}
</style>
</head>

<body>

<h2>👑 店长控制系统 · 企业终极稳定版</h2>

<button onclick="addStaff()">添加员工</button>
<button onclick="removeStaff()">删除员工</button>
<button onclick="generate()">生成排班 / 慢恢复公平</button>
<button onclick="clearAbsence()">清空缺勤</button>

<h3>排班表（30天稳定）</h3>
<table id="schedule"></table>

<h3>员工统计（自动公平监控）</h3>
<table id="stats"></table>

<h3>缺勤历史</h3>
<table id="history"></table>

<script>
// ===== Firebase 配置（用你自己的）=====
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ===== 全局 =====
let staff=[];
let schedule={};
let history=[];

// ===== 初始化 =====
async function init(){
  await loadStaff();
  await loadSchedule();
  await loadHistory();
  render();
}
init();

// ===== 读取员工 =====
async function loadStaff(){
  const doc=await db.collection("staff").doc("list").get();
  staff=doc.exists?doc.data().names:[];
}

// ===== 读取排班 =====
async function loadSchedule(){
  const doc=await db.collection("schedule").doc("month").get();
  schedule=doc.exists?doc.data():{};
}

// ===== 读取缺勤历史 =====
async function loadHistory(){
  const snap=await db.collection("absence").orderBy("time","desc").get();
  history=snap.docs.map(d=>d.data());
}

// ===== 渲染 =====
function render(){
  renderSchedule();
  renderStats();
  renderHistory();
}

// ===== 渲染排班 =====
function renderSchedule(){
  let html="<tr><th>Dia</th><th>Cocina1</th><th>Cocina2</th><th>Salon1</th><th>Salon2</th><th>Baño H</th><th>Baño M</th><th>缺勤</th></tr>";
  for(let d=1;d<=30;d++){
    let row=schedule["day"+d]||{};
    html+=`<tr>
    <td class="locked">${d}</td>
    <td>${row.c1||""}</td>
    <td>${row.c2||""}</td>
    <td>${row.s1||""}</td>
    <td>${row.s2||""}</td>
    <td>${row.h||""}</td>
    <td>${row.m||""}</td>
    <td><input onchange="setAbsent(${d},this.value)" value="${row.abs||""}"></td>
    </tr>`;
  }
  document.getElementById("schedule").innerHTML=html;
}

// ===== 缺勤登记（只改当天）=====
async function setAbsent(day,name){
  if(!schedule["day"+day])return;
  schedule["day"+day].abs=name;

  await db.collection("absence").add({
    day:day,
    name:name,
    time:Date.now()
  });

  await saveSchedule();
  await loadHistory();
  render();
}

// ===== 清空缺勤 =====
async function clearAbsence(){
  for(let d=1;d<=30;d++){
    if(schedule["day"+d]) schedule["day"+d].abs="";
  }
  await saveSchedule();
  render();
}

// ===== 生成排班（稳定慢恢复）=====
async function generate(){
  let stats=countStats();

  for(let d=1;d<=30;d++){
    if(!schedule["day"+d]) schedule["day"+d]={};

    let day=schedule["day"+d];

    if(day.abs){ // 当天缺勤只修当天
      let pool=staff.filter(x=>x!==day.abs);
      day.c1=pick(pool,stats,"cocina");
      day.c2=pick(pool,stats,"cocina");
      day.s1=pick(pool,stats,"salon");
      day.s2=pick(pool,stats,"salon");
      day.h=pick(pool,stats,"h");
      day.m=pick(pool,stats,"m");
    }else{
      // 慢恢复公平（只轻微调整）
      let pool=[...staff];
      day.c1=pick(pool,stats,"cocina");
      day.c2=pick(pool,stats,"cocina");
      day.s1=pick(pool,stats,"salon");
      day.s2=pick(pool,stats,"salon");
      day.h=pick(pool,stats,"h");
      day.m=pick(pool,stats,"m");
    }
  }

  await saveSchedule();
  render();
}

// ===== 统计 =====
function countStats(){
  let s={};
  staff.forEach(x=>s[x]={cocina:0,salon:0,h:0,m:0,total:0});

  for(let d=1;d<=30;d++){
    let day=schedule["day"+d];
    if(!day)continue;
    if(day.c1)s[day.c1].cocina++;
    if(day.c2)s[day.c2].cocina++;
    if(day.s1)s[day.s1].salon++;
    if(day.s2)s[day.s2].salon++;
    if(day.h)s[day.h].h++;
    if(day.m)s[day.m].m++;
  }
  return s;
}

// ===== 按公平选人 =====
function pick(pool,stats,type){
  pool.sort((a,b)=>stats[a][type]-stats[b][type]);
  return pool.shift();
}

// ===== 保存 =====
async function saveSchedule(){
  await db.collection("schedule").doc("month").set(schedule);
}

// ===== 员工管理 =====
async function addStaff(){
  let n=prompt("员工名");
  if(!n)return;
  staff.push(n);
  await db.collection("staff").doc("list").set({names:staff});
}

async function removeStaff(){
  let n=prompt("删除员工名");
  staff=staff.filter(x=>x!==n);
  await db.collection("staff").doc("list").set({names:staff});
}

// ===== 历史 =====
function renderHistory(){
  let html="<tr><th>Dia</th><th>缺勤</th></tr>";
  history.slice(0,20).forEach(h=>{
    html+=`<tr><td>${h.day}</td><td>${h.name}</td></tr>`;
  });
  document.getElementById("history").innerHTML=html;
}

// ===== 统计渲染 =====
function renderStats(){
  let stats=countStats();
  let html="<tr><th>姓名</th><th>Cocina</th><th>Salon</th><th>H</th><th>M</th></tr>";
  for(let k in stats){
    let s=stats[k];
    html+=`<tr><td>${k}</td><td>${s.cocina}</td><td>${s.salon}</td><td>${s.h}</td><td>${s.m}</td></tr>`;
  }
  document.getElementById("stats").innerHTML=html;
}
</script>
</body>
</html>
