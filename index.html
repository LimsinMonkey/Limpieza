<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Limpieza Scheduler</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBHZU6dHcyLl1MJW2NzEZx4zwpV_spv9Os",
  authDomain: "limpieza-peron.firebaseapp.com",
  projectId: "limpieza-peron",
  storageBucket: "limpieza-peron.firebasestorage.app",
  messagingSenderId: "542479002690",
  appId: "1:542479002690:web:33a321a6fa818674f891db"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const days=["Lunes","Martes","Miercoles","Jueves","Viernes","Sabado"];

window.guardar=async function(){
const table=document.getElementById("tabla");
let data=[];

for(let i=1;i<=6;i++){
let r=table.rows[i];
data.push({
day:days[i-1],
cocina:[r.cells[1].innerText,r.cells[2].innerText],
salon:[r.cells[3].innerText,r.cells[4].innerText],
hombre:r.cells[5].innerText,
mujer:r.cells[6].innerText
});
}

await setDoc(doc(db,"scheduler","week"),{data});
alert("已保存，全店同步");
}

window.cargar=async function(){
const snap=await getDoc(doc(db,"scheduler","week"));
if(!snap.exists()) return;

const data=snap.data().data;
const table=document.getElementById("tabla");

for(let i=0;i<data.length;i++){
let r=table.rows[i+1];
r.cells[1].innerText=data[i].cocina[0];
r.cells[2].innerText=data[i].cocina[1];
r.cells[3].innerText=data[i].salon[0];
r.cells[4].innerText=data[i].salon[1];
r.cells[5].innerText=data[i].hombre;
r.cells[6].innerText=data[i].mujer;
}
}
</script>

<style>
body{font-family:Arial;background:#f4f6f8;padding:20px}
table{border-collapse:collapse;background:white}
td,th{border:1px solid #ccc;padding:8px;text-align:center}
td{min-width:110px}
button{padding:8px 16px;margin:10px}
</style>
</head>

<body onload="cargar()">

<h2>排班表（在线同步）</h2>

<table id="tabla">
<tr>
<th>Dia</th>
<th>Cocina1</th>
<th>Cocina2</th>
<th>Salon1</th>
<th>Salon2</th>
<th>Baño Hombre</th>
<th>Baño Mujer</th>
</tr>

<tr><td>Lunes</td><td contenteditable></td><td contenteditable></td><td contenteditable></td><td contenteditable></td><td contenteditable></td><td contenteditable></td></tr>
<tr><td>Martes</td><td contenteditable></td><td contenteditable></td><td contenteditable></td><td contenteditable></td><td contenteditable></td><td contenteditable></td></tr>
<tr><td>Miercoles</td><td contenteditable></td><td contenteditable></td><td contenteditable></td><td contenteditable></td><td contenteditable></td><td contenteditable></td></tr>
<tr><td>Jueves</td><td contenteditable></td><td contenteditable></td><td contenteditable></td><td contenteditable></td><td contenteditable></td><td contenteditable></td></tr>
<tr><td>Viernes</td><td contenteditable></td><td contenteditable></td><td contenteditable></td><td contenteditable></td><td contenteditable></td><td contenteditable></td></tr>
<tr><td>Sabado</td><td contenteditable></td><td contenteditable></td><td contenteditable></td><td contenteditable></td><td contenteditable></td><td contenteditable></td></tr>
</table>

<button onclick="guardar()">保存排班</button>

</body>
</html>
